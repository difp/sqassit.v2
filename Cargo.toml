[package]
name = "sqassit"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hex = "0.4"
getrandom = "0.2.17"
hmac = "0.12"
serde_json = "1"
sha2 = "0.10"
form_urlencoded = "1"
rusqlite = { version = "0.42.0", features = ["bundled", "functions"] }
unicode-casefold = "0.2.0"
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
minijinja = { version = "3.1.0", features = ["builtins"] }
tower-http = { version = "0.7.1", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
unicode-general-category = "1.1.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
subtle = "2.6.1"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
